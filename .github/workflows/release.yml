name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，例如 v0.6.0-alpha'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="$REF_NAME"
          fi
          [[ "$VERSION" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || {
            echo "版本号必须以小写 v 开头，例如 v0.6.0-alpha" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create missing tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "标签 $VERSION 已存在"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$VERSION" -m "LukePanel $VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi
      - name: Checkout release revision
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --force --tags origin
          git checkout --detach "$VERSION"
      - name: Prepare embedded frontend
        run: make frontend
      - name: Test
        run: go test ./...
      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/lukepanel-linux-${arch}" ./cmd/lukepanel
          done
          cp install.sh uninstall.sh dist/
          (cd dist && sha256sum lukepanel-linux-* install.sh uninstall.sh > SHA256SUMS)
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --generate-notes --title "$VERSION"
          fi
