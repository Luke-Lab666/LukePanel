name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Prepare embedded frontend
        run: make frontend
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o "dist/lukepanel-linux-${GOARCH}" ./cmd/lukepanel
      - uses: actions/upload-artifact@v4
        with:
          name: lukepanel-linux-${{ matrix.goarch }}
          path: dist/lukepanel-linux-${{ matrix.goarch }}
          if-no-files-found: error
